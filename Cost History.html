<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Cost History</title>

<link rel="stylesheet"
      href="Stock.css">

<style>

body{
    font-family:Arial,sans-serif;
}

.page-title{
    text-align:center;
    margin:20px 0;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin:15px 0;
}

.controls input,
.controls select{
    padding:8px;
    min-width:150px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

.table-container{
    width:100%;
    overflow-x:auto;
    margin-top:15px;
}

table{
    width:100%;
    min-width:1100px;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
    white-space:nowrap;
}

th{
    background:#12355b;
    color:white;
}

.action-buttons{
    display:flex;
    gap:5px;
    justify-content:center;
    flex-wrap:wrap;
}

.action-buttons button{
    padding:5px 8px;
    font-size:12px;
}

.summary-container{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin:20px 0;
}

.summary-card{
    flex:1;
    min-width:180px;
    padding:15px;
    border:1px solid #ccc;
    text-align:center;
    border-radius:6px;
}

.summary-card h3{
    margin:0 0 8px 0;
}

.summary-card div{
    font-size:20px;
    font-weight:bold;
}

#loadingMessage{
    text-align:center;
    padding:20px;
    font-weight:bold;
}

@media print{

    .no-print{
        display:none !important;
    }

    table{
        min-width:100%;
        font-size:10px;
    }

    th,
    td{
        padding:5px;
    }

}

</style>

</head>


<body>

<h2 style="text-align:center;">
    MECAS ENGINEERING PVT LIMITED SUNDAR
</h2>

<h1 class="page-title">
    COST HISTORY
</h1>


<!-- =====================================
     TOP BUTTONS
===================================== -->

<div class="controls no-print">

    <button onclick="backToCost()">
        Back to Cost
    </button>

    <button onclick="openYearHistory()">
        Year Wise History
    </button>

    <button onclick="goDashboard()">
        Dashboard
    </button>

</div>


<!-- =====================================
     FILTERS
===================================== -->

<div class="controls no-print">

    <input
        type="text"
        id="historySearch"
        placeholder="Search..."
        oninput="filterCostHistory()"
    >

    <select
        id="historyMonth"
        onchange="showCostHistory()"
    >

        <option value="">
            All Months
        </option>

        <option value="01">
            January
        </option>

        <option value="02">
            February
        </option>

        <option value="03">
            March
        </option>

        <option value="04">
            April
        </option>

        <option value="05">
            May
        </option>

        <option value="06">
            June
        </option>

        <option value="07">
            July
        </option>

        <option value="08">
            August
        </option>

        <option value="09">
            September
        </option>

        <option value="10">
            October
        </option>

        <option value="11">
            November
        </option>

        <option value="12">
            December
        </option>

    </select>


    <select
        id="historyYear"
        onchange="showCostHistory()"
    >

        <option value="">
            All Years
        </option>

    </select>


    <button onclick="showAllHistory()">
        Show All
    </button>


    <button onclick="saveCurrentCostHistory()">
        Save Current Cost
    </button>


    <button onclick="printCostHistory()">
        Print History
    </button>

</div>


<!-- =====================================
     LOADING
===================================== -->

<div id="loadingMessage">
    Loading Cost History...
</div>


<!-- =====================================
     SUMMARY
===================================== -->

<div class="summary-container">

    <div class="summary-card">

        <h3>
            Total Months
        </h3>

        <div id="totalMonths">
            0
        </div>

    </div>


    <div class="summary-card">

        <h3>
            Total Stock Cost
        </h3>

        <div id="totalStockCost">
            0.00
        </div>

    </div>


    <div class="summary-card">

        <h3>
            Total Demand Cost
        </h3>

        <div id="totalDemandCost">
            0.00
        </div>

    </div>

</div>


<!-- =====================================
     TABLE
===================================== -->

<div class="table-container">

<table id="costHistoryTable">

<thead>

<tr>

    <th>
        Year
    </th>

    <th>
        Month
    </th>

    <th>
        Total Items
    </th>

    <th>
        Available Stock Cost
    </th>

    <th>
        Approved Demand Qty
    </th>

    <th>
        Approved Demand Cost
    </th>

    <th>
        Saved Date
    </th>

    <th>
        Action
    </th>

</tr>

</thead>


<tbody id="historyBody">

</tbody>


<tfoot>

<tr>

    <th colspan="3">
        TOTAL
    </th>

    <th id="footerStockCost">
        0.00
    </th>

    <th id="footerDemandQty">
        0.00
    </th>

    <th id="footerDemandCost">
        0.00
    </th>

    <th>
    </th>

    <th>
    </th>

</tr>

</tfoot>

</table>

</div>


<script src="Cost History.js"></script>

</body>

</html>
