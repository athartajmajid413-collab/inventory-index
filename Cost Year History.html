<!DOCTYPE html>
<html>

<head>

    <title>Cost Year History</title>

    <style>

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
        }

        .company-name {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #12355b;
        }

        h1 {
            text-align: center;
            color: #12355b;
        }

        .controls {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 9px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #12355b;
            color: white;
            margin: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        select {
            padding: 9px;
            margin: 5px;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background-color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background-color: #12355b;
            color: white;
            padding: 10px;
            border: 1px solid #ddd;
        }

        td {
            padding: 9px;
            border: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background-color: #f2f5f9;
        }

        .total-row {
            font-weight: bold;
            background-color: #e8eef5;
        }

        .empty-message {
            text-align: center;
            padding: 25px;
            font-weight: bold;
        }

        @media print {

            body {
                background-color: white;
                padding: 0;
            }

            .no-print {
                display: none !important;
            }

            table {
                min-width: 0;
                font-size: 10px;
            }

            @page {
                size: A4 landscape;
                margin: 8mm;
            }

        }

    </style>

</head>


<body>


<div class="company-name">

    MECAS ENGINEERING PVT LIMITED SUNDAR

</div>


<h1>

    YEAR-WISE COST HISTORY

</h1>


<!-- =====================================
     CONTROLS
===================================== -->

<div class="controls no-print">

    <button
        type="button"
        onclick="backToCostHistory()"
    >

        ⬅ Back to Cost History

    </button>
    <button
    type="button"
    onclick="window.location.href='Dashboard.html'"
>
    🏠 Back to Dashboard
</button>


    <label>

        Select Year:

    </label>


    <select
        id="yearSelect"
        onchange="showYearHistory()"
    >

        <option value="">
            Select Year
        </option>

    </select>


    <button
        type="button"
        onclick="printYearHistory()"
    >

        🖨️ Print

    </button>

</div>


<!-- =====================================
     YEAR TITLE
===================================== -->

<h2 id="yearTitle">

    Please Select Year

</h2>


<!-- =====================================
     TABLE
===================================== -->

<div class="table-container">


<table>

    <thead>

        <tr>

            <th>
                Month
            </th>

            <th>
                Available Stock Cost
            </th>

            <th>
                Approved Demand Qty
            </th>

            <th>
                Approved Demand Cost
            </th>

            <th>
                Total Cost
            </th>

            <th class="no-print">
                Action
            </th>

        </tr>

    </thead>


    <tbody id="yearHistoryBody">

    </tbody>


    <tfoot>

        <tr class="total-row">

            <td>
                YEAR TOTAL
            </td>

            <td id="yearStockCost">
                Rs. 0
            </td>

            <td id="yearDemandQty">
                0
            </td>

            <td id="yearDemandCost">
                Rs. 0
            </td>

            <td id="yearTotalCost">
                Rs. 0
            </td>

            <td class="no-print">
                -
            </td>

        </tr>

    </tfoot>

</table>


</div>


<script src="Cost Year History .js"></script>


</body>

</html>
