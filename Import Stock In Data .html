<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Import Stock In Data</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:40px;
            font-family:Arial,sans-serif;
            background:#f2f5f9;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:white;
            padding:35px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.12);
            text-align:center;
        }

        h1{
            color:#12355b;
            margin-bottom:10px;
        }

        p{
            color:#555;
            line-height:1.6;
        }

        .info{
            margin-top:25px;
            padding:20px;
            background:#eef5ff;
            border-radius:8px;
            text-align:left;
        }

        .info strong{
            color:#12355b;
        }

        button{
            margin-top:25px;
            padding:13px 25px;
            border:none;
            border-radius:7px;
            background:#12355b;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            opacity:0.9;
        }

        #status{
            margin-top:25px;
            font-weight:bold;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>
        📥 Import Stock In Data
    </h1>

    <p>
        یہ page LocalStorage میں موجود پرانا
        <strong>Stock In</strong> data
        Supabase میں منتقل کرے گا۔
    </p>


    <div class="info">

        <p>
            <strong>Source:</strong>
            LocalStorage → history
        </p>

        <p>
            <strong>Data:</strong>
            صرف Stock In records
        </p>

        <p>
            <strong>Destination:</strong>
            Supabase → stock_ins
        </p>

        <p>
            <strong>Duplicate:</strong>
            پہلے سے موجود record دوبارہ نہیں ڈالا جائے گا۔
        </p>

    </div>


    <button
        type="button"
        onclick="importStockInData()"
    >
        📥 Import Stock In Data
    </button>


    <p id="status"></p>

</div>


<!-- =====================================
     SUPABASE CONNECTION
===================================== -->

<script src="supabase.js"></script>


<!-- =====================================
     STOCK IN IMPORT
===================================== -->

<script src="Import Stock In Data.js"></script>


</body>

</html>
