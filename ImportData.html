<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Website Data</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#12355b,#1677ff);
    min-height:100vh;
    padding:30px 15px;
}
.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}
h1{color:#12355b;margin-top:0}
p{color:#555;line-height:1.5}
textarea{
    width:100%;
    min-height:420px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-family:Consolas,monospace;
    font-size:13px;
    resize:vertical;
}
button{
    border:0;
    border-radius:8px;
    padding:13px 20px;
    margin:12px 8px 0 0;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#12355b;
}
button:hover{background:#1677ff}
.back{background:#666}
.clear{background:#c0392b}
#status{
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    display:none;
    white-space:pre-line;
}
.success{background:#e8f8ee;color:#176b36}
.error{background:#fdecea;color:#a93226}
.small{font-size:13px;color:#777}
</style>
</head>
<body>

<div class="container">
    <h1>📥 Import Website Data</h1>

    <p>
        یہاں اپنی پرانی website کا LocalStorage data paste کریں۔
        پھر <b>Import Data</b> دبائیں۔
    </p>

    <p class="small">
        Data JSON format میں ہونا چاہیے، مثلاً:
        {"items":"[...]","history":"[...]","demandEdits":"{...}"}
    </p>

    <textarea id="dataInput" placeholder="یہاں اپنا Console / LocalStorage JSON data paste کریں..."></textarea>

    <br>

    <button onclick="importData()">📥 Import Data</button>
    <button class="clear" onclick="clearBox()">🗑 Clear</button>
    <button class="back" onclick="goDashboard()">🏠 Dashboard</button>

    <div id="status"></div>
</div>

<script>
function showStatus(message, type){
    const box = document.getElementById("status");
    box.textContent = message;
    box.className = type;
    box.style.display = "block";
}

function importData(){

    const text = document.getElementById("dataInput").value.trim();

    if(!text){
        showStatus("❌ پہلے data paste کریں۔", "error");
        return;
    }

    let data;

    try{
        data = JSON.parse(text);
    }
    catch(error){
        showStatus(
            "❌ Data JSON format میں درست نہیں ہے۔\n\n" +
            "پورا data { ... } کے ساتھ paste کریں۔\n\n" +
            "Error: " + error.message,
            "error"
        );
        return;
    }

    if(!data || typeof data !== "object" || Array.isArray(data)){
        showStatus("❌ Data کا format درست نہیں ہے۔", "error");
        return;
    }

    let count = 0;

    try{
        Object.keys(data).forEach(function(key){

            let value = data[key];

            /*
             * LocalStorage میں ہر value string کے طور پر save ہوتی ہے۔
             * اگر value پہلے ہی string ہے تو اسی طرح save کریں گے۔
             */
            if(typeof value !== "string"){
                value = JSON.stringify(value);
            }

            localStorage.setItem(key, value);
            count++;
        });

        showStatus(
            "✅ Data successfully import ہو گیا!\n\n" +
            "Total keys imported: " + count +
            "\n\nاب Dashboard کھولیں۔",
            "success"
        );

    }
    catch(error){
        showStatus(
            "❌ Data save نہیں ہو سکا۔\n\n" + error.message,
            "error"
        );
    }
}

function clearBox(){
    document.getElementById("dataInput").value = "";
    document.getElementById("status").style.display = "none";
}

function goDashboard(){
    window.location.href = "Dashboard.html";
}
</script>

</body>
</html>
