<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Import Data - Store Management System</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#f2f5f9;
        }

        .container{
            max-width:1000px;
            margin:40px auto;
            padding:20px;
        }

        .box{
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.12);
        }

        h1{
            margin-top:0;
            color:#12355b;
        }

        p{
            color:#555;
            line-height:1.6;
        }

        textarea{
            width:100%;
            height:350px;
            padding:15px;
            border:1px solid #ccc;
            border-radius:10px;
            font-family:monospace;
            font-size:13px;
            resize:vertical;
        }

        textarea:focus{
            outline:none;
            border-color:#1677ff;
            box-shadow:0 0 0 2px rgba(22,119,255,.15);
        }

        .buttons{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            margin-top:15px;
        }

        button{
            padding:12px 18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            font-size:14px;
        }

        .import{
            background:#16a085;
            color:white;
        }

        .clear{
            background:#e74c3c;
            color:white;
        }

        .dashboard{
            background:#12355b;
            color:white;
        }

        button:hover{
            opacity:.9;
        }

        #message{
            margin-top:20px;
            padding:15px;
            border-radius:8px;
            display:none;
            font-weight:bold;
            line-height:1.7;
        }

        .success{
            background:#d5f5e3;
            color:#1e8449;
        }

        .error{
            background:#fadbd8;
            color:#922b21;
        }

        .info{
            background:#e8f1ff;
            color:#12355b;
        }

        .help{
            background:#fff8e1;
            border-left:5px solid #f39c12;
            padding:15px;
            margin:20px 0;
            line-height:1.6;
        }

        .key-list{
            margin-top:15px;
            padding:15px;
            background:#f7f9fb;
            border-radius:8px;
            display:none;
        }

        .key-list b{
            color:#12355b;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="box">

        <h1>
            📥 Import Website Data
        </h1>


        <p>
            یہاں اپنا copied LocalStorage data paste کریں۔
            پھر <b>Import Data</b> button دبائیں۔
        </p>


        <div class="help">

            <b>اہم:</b><br>

            جو data آپ نے پرانی website سے copy کیا ہے،
            اسے پورا paste کریں۔ درمیان سے data نہ کاٹیں۔

            <br><br>

            Import کے بعد Dashboard کھولیں۔
            Data اسی browser کی LocalStorage میں save ہو جائے گا۔

        </div>


        <textarea
            id="dataInput"
            placeholder="یہاں اپنا copied data paste کریں..."
        ></textarea>


        <div class="buttons">

            <button
                class="import"
                onclick="importData()"
            >
                📥 Import Data
            </button>


            <button
                class="clear"
                onclick="clearData()"
            >
                🗑 Clear Box
            </button>


            <button
                class="dashboard"
                onclick="window.location.href='Dashboard.html'"
            >
                🏠 Dashboard
            </button>

        </div>


        <div id="message"></div>


        <div
            id="keyList"
            class="key-list"
        ></div>


    </div>

</div>



<script>


// =====================================
// SHOW MESSAGE
// =====================================

function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    message.className =
        type;

    message.style.display =
        "block";

}


// =====================================
// SAFE JSON PARSE
// =====================================

function parseValue(value){

    if(
        typeof value !== "string"
    ){

        return value;

    }


    let result =
        value.trim();


    /*
       کئی بار LocalStorage data
       JSON string کے اندر JSON string
       ہوتا ہے۔
    */

    for(let i = 0; i < 3; i++){

        if(
            typeof result !== "string"
        ){

            break;

        }


        try{

            result =
                JSON.parse(result);

        }
        catch(e){

            break;

        }

    }


    return result;

}


// =====================================
// SAVE LOCAL STORAGE VALUE
// =====================================

function saveKey(key,value){

    const parsed =
        parseValue(value);


    /*
       Dashboard کے لیے arrays/objects
       ہمیشہ proper JSON میں save ہوں گے۔
    */

    if(
        typeof parsed === "object"
    ){

        localStorage.setItem(
            key,
            JSON.stringify(parsed)
        );

    }
    else{

        localStorage.setItem(
            key,
            String(parsed)
        );

    }

}


// =====================================
// IMPORT DATA
// =====================================

function importData(){

    const input =
        document.getElementById(
            "dataInput"
        ).value.trim();


    if(!input){

        showMessage(
            "❌ پہلے data paste کریں۔",
            "error"
        );

        return;

    }


    try{

        let data = null;


        // =================================
        // METHOD 1
        // DIRECT JSON
        // =================================

        try{

            data =
                JSON.parse(input);

        }
        catch(e){

            data = null;

        }


        // =================================
        // METHOD 2
        // FIND JSON OBJECT
        // =================================

        if(!data){

            const firstBrace =
                input.indexOf("{");

            const lastBrace =
                input.lastIndexOf("}");


            if(
                firstBrace >= 0 &&
                lastBrace > firstBrace
            ){

                const cleaned =
                    input.substring(
                        firstBrace,
                        lastBrace + 1
                    );


                try{

                    data =
                        JSON.parse(cleaned);

                }
                catch(e){

                    data = null;

                }

            }

        }


        // =================================
        // CHECK DATA
        // =================================

        if(
            !data ||
            typeof data !== "object" ||
            Array.isArray(data)
        ){

            throw new Error(
                "Data format صحیح نہیں ہے."
            );

        }


        // =================================
        // IMPORT ALL KEYS
        // =================================

        let importedKeys = [];


        Object.keys(data).forEach(function(key){

            saveKey(
                key,
                data[key]
            );


            importedKeys.push(
                key
            );

        });


        // =================================
        // IMPORTANT DASHBOARD KEYS
        // =================================

        /*
           اگر copied data میں یہ names موجود ہوں
           تو انہیں Dashboard کے standard names
           پر بھی save کریں گے۔
        */


        // -------------------------------
        // ITEMS
        // -------------------------------

        if(
            !localStorage.getItem("items")
        ){

            const possibleItems =
                data.masterList ||
                data.master ||
                data.products ||
                data.inventory ||
                data.itemList;


            if(possibleItems){

                saveKey(
                    "items",
                    possibleItems
                );

                importedKeys.push(
                    "items"
                );

            }

        }


        // -------------------------------
        // HISTORY
        // -------------------------------

        if(
            !localStorage.getItem("history")
        ){

            const possibleHistory =
                data.stockHistory ||
                data.inventoryHistory ||
                data.transactions ||
                data.stockTransactions;


            if(possibleHistory){

                saveKey(
                    "history",
                    possibleHistory
                );

                importedKeys.push(
                    "history"
                );

            }

        }


        // -------------------------------
        // DEMANDS
        // -------------------------------

        if(
            !localStorage.getItem("demands")
        ){

            const possibleDemands =
                data.demand ||
                data.monthlyDemand ||
                data.demandData;


            if(possibleDemands){

                saveKey(
                    "demands",
                    possibleDemands
                );

                importedKeys.push(
                    "demands"
                );

            }

        }


        // -------------------------------
        // DEMAND HISTORY
        // -------------------------------

        if(
            !localStorage.getItem("demandHistory")
        ){

            const possibleDemandHistory =
                data.demandHistories ||
                data.monthlyDemandHistory ||
                data.demandHistoryData;


            if(possibleDemandHistory){

                saveKey(
                    "demandHistory",
                    possibleDemandHistory
                );

                importedKeys.push(
                    "demandHistory"
                );

            }

        }


        // =================================
        // CHECK DASHBOARD DATA
        // =================================

        const itemsData =
            localStorage.getItem("items");

        const historyData =
            localStorage.getItem("history");

        const demandsData =
            localStorage.getItem("demands");

        const demandHistoryData =
            localStorage.getItem("demandHistory");


        let itemCount = 0;
        let historyCount = 0;
        let demandCount = 0;
        let demandHistoryCount = 0;


        try{

            itemCount =
                itemsData
                ? JSON.parse(itemsData).length
                : 0;

        }
        catch(e){

            itemCount = 0;

        }


        try{

            historyCount =
                historyData
                ? JSON.parse(historyData).length
                : 0;

        }
        catch(e){

            historyCount = 0;

        }


        try{

            demandCount =
                demandsData
                ? JSON.parse(demandsData).length
                : 0;

        }
        catch(e){

            demandCount = 0;

        }


        try{

            demandHistoryCount =
                demandHistoryData
                ? JSON.parse(demandHistoryData).length
                : 0;

        }
        catch(e){

            demandHistoryCount = 0;

        }


        // =================================
        // RESULT
        // =================================

        showMessage(
            "✅ Data successfully imported! " +
            importedKeys.length +
            " data keys save ہو گئی ہیں۔",
            "success"
        );


        // =================================
        // SHOW IMPORTED KEYS
        // =================================

        const keyList =
            document.getElementById(
                "keyList"
            );


        keyList.innerHTML =

            "<b>Imported Keys:</b><br>" +

            importedKeys.join(
                "<br>"
            ) +

            "<br><br>" +

            "<b>Dashboard Data:</b><br>" +

            "Items: " +
            itemCount +

            "<br>" +

            "History: " +
            historyCount +

            "<br>" +

            "Demands: " +
            demandCount +

            "<br>" +

            "Demand History: " +
            demandHistoryCount;


        keyList.style.display =
            "block";


        // =================================
        // CONSOLE
        // =================================

        console.log(
            "Imported data:",
            data
        );

        console.log(
            "LocalStorage items:",
            localStorage.getItem("items")
        );

        console.log(
            "LocalStorage history:",
            localStorage.getItem("history")
        );

        console.log(
            "LocalStorage demands:",
            localStorage.getItem("demands")
        );

        console.log(
            "LocalStorage demandHistory:",
            localStorage.getItem("demandHistory")
        );

    }


    catch(error){

        console.error(error);

        showMessage(
            "❌ Data import نہیں ہو سکا۔ " +
            "براہِ کرم check کریں کہ آپ نے مکمل data paste کیا ہے۔",
            "error"
        );

    }

}


// =====================================
// CLEAR TEXTAREA
// =====================================

function clearData(){

    document.getElementById(
        "dataInput"
    ).value = "";


    document.getElementById(
        "message"
    ).style.display =
        "none";


    document.getElementById(
        "keyList"
    ).style.display =
        "none";

}


// =====================================
// PAGE LOAD
// =====================================

console.log(
    "Import Data page loaded."
);

console.log(
    "Current LocalStorage:",
    localStorage
);


</script>


</body>

</html>
