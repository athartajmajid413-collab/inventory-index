<!DOCTYPE html>
<html>

<head>
    <title>Master List</title>
    <link rel="stylesheet" href="style7.css">
</head>

<body>

<h1>ITEM MASTER</h1>

<div class="container">

    <button
        type="button"
        onclick="window.location.href='Dashboard.html'"
    >
        🏠 Back to Dashboard
    </button>

<form>

    <!-- Item Code -->
    <label for="code">
        Enter ID Number :
    </label>

    <input
        type="text"
        id="code"
        placeholder="Enter ID Number"
    >

    <br><br>


    <!-- Item Name -->
    <label for="itemName">
        Enter Items Name :
    </label>

    <input
        type="text"
        id="itemName"
        placeholder="Enter items Name"
    >

    <br><br>


    <!-- Specification -->
    <label for="specification">
        Enter specification :
    </label>

    <input
        type="text"
        id="specification"
        placeholder="Enter specification"
    >

    <br><br>


    <!-- Category -->
    <label for="category">
        Enter category :
    </label>

    <input
        type="text"
        id="category"
        placeholder="Enter category"
    >

    <br><br>


    <!-- Unit -->
    <label for="unit">
        Enter unit :
    </label>

    <input
        type="text"
        id="unit"
        placeholder="Enter unit"
    >

    <br><br>


    <!-- Packing Quantity -->
    <label for="packingQty">
        Packing Qty:
    </label>

    <input
        type="number"
        id="packingQty"
        placeholder="Enter Packing Qty"
        min="0"
    >

    <br><br>


    <!-- Packed Unit -->
    <label for="packedUnit">
        Packed Unit:
    </label>

    <input
        type="text"
        id="packedUnit"
        placeholder="Enter Packed Unit"
    >

    <br><br>


    <!-- Source -->
    <label for="source">
        Source:
    </label>

    <input
        type="text"
        id="source"
        placeholder="Enter Source"
    >

    <br><br>


    <!-- Supplier -->
    <label for="supplier">
        Supplier:
    </label>

    <input
        type="text"
        id="supplier"
        placeholder="Enter Supplier"
    >

    <br><br>


    <!-- Opening Stock -->
    <label for="openStock">
        Enter Opening Stock :
    </label>

    <input
        type="number"
        id="openStock"
        placeholder="Enter opening Stock"
    >

    <br><br>


    <!-- Opening Cost -->
    <label for="openingCost">
        Enter Opening Cost :
    </label>

    <input
        type="number"
        id="openingCost"
        placeholder="Enter Opening Cost"
        min="0"
        step="0.01"
    >

    <br><br>


    <!-- Location -->
    <label for="location">
        Storage location:
    </label>

    <input
        type="text"
        id="location"
        placeholder="Enter location"
    >

    <br><br>


    <button
        type="button"
        onclick="saveItem()"
    >
        Save
    </button>


    <button
        type="button"
        onclick="clearForm()"
    >
        Clear
    </button>

</form>

</div>


<label for="search">
    Search Item:
</label>

<input
    type="text"
    id="search"
    placeholder="Enter Code or Item Name"
    oninput="searchItem()"
>


<h2>item List</h2>

<table border="1">

    <tr>

        <th>Code</th>
        <th>Item Name</th>
        <th>Specification</th>
        <th>Category</th>
        <th>Unit</th>
        <th>Packing Qty</th>
        <th>Packed Unit</th>
        <th>Source</th>
        <th>Supplier</th>

        <th>Opening Stock</th>
        <th>Opening Cost</th>
        <th>Stock In</th>
        <th>Stock Out</th>
        <th>Current Balance</th>

        <th>Location</th>
        <th>Status</th>
        <th>Action</th>

    </tr>

    <tbody id="tableBody"></tbody>

</table>


<script src="Master List.js"></script>

</body>

</html>
