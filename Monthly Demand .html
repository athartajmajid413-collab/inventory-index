<!DOCTYPE html>
<html>

<head>

    <title>Monthly Demand</title>

    <style>

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin-top: 5px;
        }

        .top-buttons {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background-color: #12355b;
            color: white;
            margin-right: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .demand-form {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.10);
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 8px;
            margin: 5px;
        }
       /* =========================================
   MONTHLY DEMAND TABLE
   ========================================= */

.table-container {
    width: 100%;
    max-width: 100%;
    max-height: 550px;

    overflow-x: auto;
    overflow-y: auto;

    background-color: white;
    border-radius: 10px;

    position: relative;
}


/* TABLE */

.table-container table {
    width: max-content;
    min-width: 100%;
    border-collapse: collapse;
}


/* =========================================
   NORMAL TABLE SCROLLBAR
   ========================================= */

.table-container::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}

.table-container::-webkit-scrollbar-track {
    background: #f1f1f1;
}

.table-container::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 8px;
}

.table-container::-webkit-scrollbar-thumb:hover {
    background: #555;
}


/* =========================================
   FIXED HORIZONTAL SCROLLBAR
   ہمیشہ SCREEN کے نیچے رہے گا
   ========================================= */

#fixedHorizontalScrollbar {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    height: 18px;

    overflow-x: auto;
    overflow-y: hidden;

    background: #f1f1f1;

    border-top: 1px solid #ccc;

    z-index: 99999;

    display: none;
}


/* scrollbar کے اندر کا حصہ */

#fixedHorizontalScrollbarContent {
    height: 1px;
}


/* Fixed scrollbar */

#fixedHorizontalScrollbar::-webkit-scrollbar {
    height: 14px;
}

#fixedHorizontalScrollbar::-webkit-scrollbar-track {
    background: #f1f1f1;
}

#fixedHorizontalScrollbar::-webkit-scrollbar-thumb {
    background: #777;
    border-radius: 8px;
}

#fixedHorizontalScrollbar::-webkit-scrollbar-thumb:hover {
    background: #555;
}

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #12355b;
            color: white;
            padding: 10px;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f2f5f9;
        }

        .months-input {
            width: 70px;
            padding: 7px;
            text-align: center;
        }

        .auto-demand {
            font-weight: bold;
        }

        .approved-cell {
            font-weight: bold;
        }

    </style>

</head>


<body>


<h2>
    MECAS ENGINEERING PVT LIMITED SUNDAR
</h2>


<h1>
    MONTHLY DEMAND
</h1>


<!-- BACK TO DASHBOARD -->

<button

>

<input

>

<!-- TABLE -->

<div class="table-container">

<table>

</div>

<script src="supabase.js"></script>
<script src="Monthly Demand .js"></script>
<script>

/* =========================================
   FIXED HORIZONTAL SCROLLBAR
   ========================================= */

document.addEventListener("DOMContentLoaded", function () {

    const tableContainer =
        document.querySelector(".table-container");

    if (!tableContainer) {
        return;
    }


    /* -----------------------------------------
       Fixed scrollbar create کریں
       ----------------------------------------- */

    const fixedScrollbar =
        document.createElement("div");

    fixedScrollbar.id =
        "fixedHorizontalScrollbar";


    const scrollbarContent =
        document.createElement("div");

    scrollbarContent.id =
        "fixedHorizontalScrollbarContent";


    fixedScrollbar.appendChild(
        scrollbarContent
    );

    document.body.appendChild(
        fixedScrollbar
    );


    /* -----------------------------------------
       Table width update
       ----------------------------------------- */

    function updateScrollbarWidth() {

        scrollbarContent.style.width =
            tableContainer.scrollWidth + "px";

    }


    /* -----------------------------------------
       Table → Fixed Scrollbar
       ----------------------------------------- */

    tableContainer.addEventListener(
        "scroll",
        function () {

            if (
                fixedScrollbar.scrollLeft !==
                tableContainer.scrollLeft
            ) {

                fixedScrollbar.scrollLeft =
                    tableContainer.scrollLeft;

            }

        }
    );


    /* -----------------------------------------
       Fixed Scrollbar → Table
       ----------------------------------------- */

    fixedScrollbar.addEventListener(
        "scroll",
        function () {

            if (
                tableContainer.scrollLeft !==
                fixedScrollbar.scrollLeft
            ) {

                tableContainer.scrollLeft =
                    fixedScrollbar.scrollLeft;

            }

        }
    );


    /* -----------------------------------------
       Show / Hide scrollbar
       صرف table کے سامنے ہونے پر
       ----------------------------------------- */

    function checkScrollbarVisibility() {

        const rect =
            tableContainer.getBoundingClientRect();


        const tableVisible =
            rect.bottom > 0 &&
            rect.top < window.innerHeight;


        const hasHorizontalScroll =
            tableContainer.scrollWidth >
            tableContainer.clientWidth;


        if (
            tableVisible &&
            hasHorizontalScroll
        ) {

            fixedScrollbar.style.display =
                "block";

        } else {

            fixedScrollbar.style.display =
                "none";

        }

    }


    /* -----------------------------------------
       Scroll / Resize
       ----------------------------------------- */

    window.addEventListener(
        "scroll",
        checkScrollbarVisibility
    );


    window.addEventListener(
        "resize",
        function () {

            updateScrollbarWidth();
            checkScrollbarVisibility();

        }
    );


    /* -----------------------------------------
       Table size change
       ----------------------------------------- */

    if (window.ResizeObserver) {

        const resizeObserver =
            new ResizeObserver(function () {

                updateScrollbarWidth();
                checkScrollbarVisibility();

            });

        resizeObserver.observe(
            tableContainer
        );

    }


    /* -----------------------------------------
       Initial
       ----------------------------------------- */

    updateScrollbarWidth();

    checkScrollbarVisibility();


});

</script>

</body>

</html>
