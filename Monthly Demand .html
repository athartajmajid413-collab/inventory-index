<!DOCTYPE html>
<html>

<head>

    <title>Monthly Demand</title>

    <style>

        body {
            margin: 0;
            padding: 25px;
            font-family: Arial, sans-serif;
            background-color: #f2f5f9;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #12355b;
            margin-top: 5px;
        }

        .top-buttons {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            background-color: #12355b;
            color: white;
            margin-right: 5px;
        }

        button:hover {
            opacity: 0.9;
        }

        .demand-form {
            background-color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.10);
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        .table-container {
            overflow-x: auto;
            background-color: white;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #12355b;
            color: white;
            padding: 10px;
            white-space: nowrap;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f2f5f9;
        }

        .months-input {
            width: 70px;
            padding: 7px;
            text-align: center;
        }

        .auto-demand {
            font-weight: bold;
        }

        .approved-cell {
            font-weight: bold;
        }

    </style>

</head>


<body>


<h2>
    MECAS ENGINEERING PVT LIMITED SUNDAR
</h2>


<h1>
    MONTHLY DEMAND
</h1>


<!-- BACK TO DASHBOARD -->

<div class="top-buttons">

    <button
        type="button"
        onclick="window.location.href='Dashboard.html'"
    >
        🏠 Back to Dashboard
    </button>

    <button
        type="button"
        onclick="window.location.href='Demand History.html'"
    >
        🏠 to Demand History
    </button>
</div>


<!-- BUTTONS -->

<div class="top-buttons">

    <button
        type="button"
        onclick="selectAllItems()"
    >
        ☑ Select All
    </button>

    <button
        type="button"
        onclick="unselectAllItems()"
    >
        ☐ Unselect All
    </button>

    <button
        type="button"
        onclick="generateDemand()"
    >
        📊 Generate Demand
    </button>

    <button
        type="button"
        onclick="printSelectedDemand()"
    >
        🖨️ Print Selected
    </button>
<button
    type="button"
    onclick="exportDemandToExcel()"
>
    📊 Export Excel
</button>
</div>


<!-- DEMAND FORM -->

<div class="demand-form">

    <label for="itemCode">
        Item Code:
    </label>

    <input
        type="text"
        id="itemCode"
        placeholder="Enter Item Code"
        oninput="showItemInfo()"
    >


    <label for="month">
        Demand Month:
    </label>

    <input
        type="month"
        id="month"
    >


    <button
        type="button"
        onclick="addDemand()"
    >
        Add Demand
    </button>

</div>


<!-- TABLE -->

<div class="table-container">

<table>

    <thead>

        <tr>

            <th>Select</th>

            <th>Category</th>

            <th>Item Code</th>

            <th>Item Name</th>

            <th>Specification</th>

            <th>Source</th>

            <th>Supplier</th>

            <th>Latest Purchase Date</th>

            <th>1st Rate</th>

            <th>2nd Rate</th>

            <th>Latest Rate</th>

            <th>Unit</th>

            <th>Packing Qty</th>

            <th>Packed Unit</th>

            <th>Consumption / Average</th>

            <th>Stock Months</th>

            <th>Current Stock</th>

            <th>Demand Quantity</th>

            <th>Approved Qty</th>

            <th>Remarks</th>

            <th>Action</th>

        </tr>

    </thead>


    <tbody id="demandBody"></tbody>


</table>

</div>

<script src="supabase.js"></script>
<script src="Monthly Demand .js"></script>


</body>

</html>
