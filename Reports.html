<!DOCTYPE html>
<html>

<head>

    <title>Reports</title>

    <link rel="stylesheet" href="Stock.css">

    <style>

        @media print {

            body {
                background-color: white;
                font-family: Arial, sans-serif;
            }

            button,
            select,
            input,
            label {
                display: none !important;
            }

            h1,
            h2 {
                text-align: center;
                color: black;
            }

            #reportSummary {
                display: block;
                text-align: center;
                margin-bottom: 20px;
                font-size: 16px;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th {
                background-color: #12355b !important;
                color: white !important;
                padding: 8px;
            }

            td {
                padding: 8px;
                border: 1px solid black;
            }

            .deleteColumn,
            .deleteButton {
                display: none !important;
            }

        }


        #printHeader {

            display: block;
            text-align: center;
            margin-bottom: 20px;

        }


        #printHeader h1 {

            margin: 0;
            font-size: 22px;

        }


        #printHeader h2 {

            margin: 5px 0;
            font-size: 18px;

        }


        #printHeader h3 {

            margin: 8px 0;
            font-size: 16px;

        }


        #printHeader p {

            margin: 5px;

        }


        table {

            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;

        }


        th {

            padding: 10px;
            background-color: #12355b;
            color: white;

        }


        td {

            padding: 8px;
            border: 1px solid #ccc;

        }


        .report-controls {

            margin-top: 20px;
            margin-bottom: 20px;

        }


        .filter-box {

            margin-bottom: 12px;

        }


        .filter-box label {

            display: inline-block;
            width: 120px;

        }


        #reportSummary {

            margin-top: 20px;
            padding: 15px;
            text-align: center;

        }


        .deleteButton {

            background-color: #c62828;
            color: white;
            border: none;
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 4px;

        }


        .deleteButton:hover {

            background-color: #a00000;

        }

    </style>

</head>


<body>


<h1>Store Reports</h1>


<!-- =========================================
     PRINT HEADER
========================================= -->

<div id="printHeader">

    <h1>
        MECAS ENGINEERING PVT LIMITED SUNDAR
    </h1>

    <h2>
        STORE MANAGEMENT SYSTEM
    </h2>

    <h3 id="printReportTitle">
        STORE REPORT
    </h3>

    <p>

        Report Date:

        <span id="printDate"></span>

    </p>

</div>


<!-- =========================================
     BACK TO DASHBOARD
========================================= -->

<div>

    <button
        type="button"
        onclick="window.location.href='Dashboard.html'"
    >

        🏠 Back to Dashboard

    </button>

</div>


<br>


<!-- =========================================
     REPORT CONTROLS
========================================= -->

<div class="report-controls">


    <div class="filter-box">

        <label for="reportType">
            Report Type:
        </label>


        <select id="reportType">

            <option value="all">
                All Transactions
            </option>

            <option value="stockIn">
                Stock In Report
            </option>

            <option value="stockOut">
                Stock Out Report
            </option>

            <option value="currentStock">
                Current Stock Report
            </option>

            <option value="cost">
                Cost Report
            </option>

            <option value="demand">
                Monthly Demand Report
            </option>

        </select>

    </div>


    <div class="filter-box">

        <label for="fromDate">
            From Date:
        </label>

        <input
            type="date"
            id="fromDate"
        >

    </div>


    <div class="filter-box">

        <label for="toDate">
            To Date:
        </label>

        <input
            type="date"
            id="toDate"
        >

    </div>


    <div class="filter-box">

        <label for="itemCode">
            Item Code:
        </label>

        <input
            type="text"
            id="itemCode"
            placeholder="Optional"
        >

    </div>
    
        <select id="department">

            <option value="">
                All Departments
            <option value="CNC">CNC</option>

    <option value="DiscLine">
        DISC LINE
    </option>

    <option value="stiffenerLine">
        STIFFENER LINE
    </option>

    <option value="Quailty">
        QUAILTY
    </option>

    <option value="PaintShop">
        PAINT SHOP
    </option>

    <option value="Phosphating">
        PHOSPHATING
    </option>

    <option value="GrindingHonning">
        GRINDING/HONNING
    </option>

    <option value="Packing">
        PACKING
    </option>

    <option value="Maintenance">
        MAINTENANCE
    </option>

    <option value="Other">
        OTHER
    </option>

</select>
    </div>


</div>


<!-- =========================================
     BUTTONS
========================================= -->

<button
    type="button"
    onclick="generateReport()"
>

    Generate Report

</button>


<button
    type="button"
    onclick="clearReport()"
>

    Clear

</button>


<br>
<br>


<!-- =========================================
     SUMMARY
========================================= -->

<div id="reportSummary">

    <strong>
        Total Entries:
    </strong>

    <span id="totalEntries">
        0
    </span>


    &nbsp;&nbsp;&nbsp;


    <strong>
        Total Quantity:
    </strong>

    <span id="reportQuantity">
        0
    </span>


    &nbsp;&nbsp;&nbsp;


    <strong>
        Total Cost:
    </strong>

    <span id="reportCost">
        0
    </span>

</div>


<br>


<!-- =========================================
     PRINT
========================================= -->

<button
    type="button"
    onclick="printReport()"
>

    🖨️ Print Report

</button>
<button
    type="button"
    onclick="exportReportToExcel()"
>
    📊 Export to Excel
</button>

<br>
<br>


<h2>
    Report
</h2>


<!-- =========================================
     REPORT TABLE
========================================= -->

<table border="1">

    <thead id="reportHead">

        <tr>

            <th>Date</th>

            <th>Time</th>

            <th>Type</th>

            <th>Item Code</th>

            <th>Item Name</th>

            <th>Department</th>

            <th>Quantity</th>

            <th>Unit Cost</th>

            <th>Total Cost</th>

            <th class="deleteColumn">
                Action
            </th>

        </tr>

    </thead>


    <tbody id="reportBody">

    </tbody>

</table>

<script src="supabase.js"></script>
<script src="Reports.js"></script>


</body>

</html>
