<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="Stock.css">
</head>

<body>

<h1>Stock In</h1>

<button
    type="button"
    onclick="window.location.href='Dashboard.html'"
>
    🏠 Back to Dashboard
</button>

<br><br>

<label for="itemCode">Item Code:</label>
<input
    type="text"
    id="itemCode"
    placeholder="Enter Item Code"
    oninput="showCurrentStock()"
>

<br><br>

<label for="itemName">Item Name:</label>
<input
    type="text"
    id="itemName"
    readonly
>

<br><br>

<label for="unit">Unit:</label>
<input
    type="text"
    id="unit"
    readonly
>

<br><br>

<label for="source">Source:</label>
<input
    type="text"
    id="source"
    placeholder="Enter Source"
>

<br><br>

<label for="supplier">Supplier:</label>
<input
    type="text"
    id="supplier"
    placeholder="Enter Supplier"
>

<br><br>

<label for="location">Location:</label>
<input
    type="text"
    id="location"
    placeholder="Enter Location"
>

<br><br>

<label for="quantity">Quantity:</label>
<input
    type="number"
    id="quantity"
    placeholder="Enter Quantity"
>

<br><br>

<label for="unitCost">Unit Cost:</label>
<input
    type="number"
    id="unitCost"
    placeholder="Enter Unit Cost"
>

<br><br>

<label for="totalCost">Total Cost:</label>
<input
    type="number"
    id="totalCost"
    readonly
>

<br><br>

<label for="transactionDate">Date:</label>
<input
    type="date"
    id="transactionDate"
>

<br><br>

<label for="transactionTime">Time:</label>
<input
    type="time"
    id="transactionTime"
>

<br><br>

<label for="currentStock">Current Stock:</label>
<input
    type="text"
    id="currentStock"
    readonly
>

<br><br>

<button
    type="button"
    id="stockInButton"
    onclick="stockIn()"
>
    Stock In
</button>

<h2>Stock In History</h2>

<button
    type="button"
    onclick="window.location.href='Stock In History.html'"
>
    📋 Open Stock In History
</button>


<script src="Stock In .js"></script>

</body>

</html>
