<!DOCTYPE html>
<html>

<head>
    <title>Stock Issue</title>
    <link rel="stylesheet" href="Stock.css">
</head>

<body>

<h1>Stock Issue</h1>

<button
    type="button"
    onclick="window.location.href='Dashboard.html'"
>
    🏠 Back to Dashboard
</button>

<br><br>

<label for="itemCode">Item Code:</label>
<input
    type="text"
    id="itemCode"
    placeholder="Enter Item Code"
    oninput="showItemInfo()"
>

<br><br>

<label for="itemName">Item Name:</label>
<input
    type="text"
    id="itemName"
    readonly
>

<br><br>

<label for="unit">Unit:</label>
<input
    type="text"
    id="unit"
    readonly
>

<br><br>

<label for="source">Source:</label>
<input
    type="text"
    id="source"
    readonly
>

<br><br>

<label for="supplier">Supplier:</label>
<input
    type="text"
    id="supplier"
    readonly
>

<br><br>

<label for="location">Location:</label>
<input
    type="text"
    id="location"
    readonly
>

<br><br>

<label for="currentStock">Current Stock:</label>
<input
    type="text"
    id="currentStock"
    readonly
>

<br><br>

<label for="department">Department:</label>

<select id="department">

    <option value="">Select Department</option>

    <option value="CNC">CNC</option>

    <option value="DiscLine">
        DISC LINE
    </option>

    <option value="stiffenerLine">
        STIFFENER LINE
    </option>

    <option value="Quailty">
        QUAILTY
    </option>

    <option value="PaintShop">
        PAINT SHOP
    </option>

    <option value="Phosphating">
        PHOSPHATING
    </option>

    <option value="GrindingHonning">
        GRINDING/HONNING
    </option>

    <option value="Packing">
        PACKING
    </option>

    <option value="Maintenance">
        MAINTENANCE
    </option>

    <option value="Other">
        OTHER
    </option>

</select>

<br><br>

<label for="quantity">Quantity:</label>

<input
    type="number"
    id="quantity"
    placeholder="Enter Quantity"
>

<br><br>

<label for="transactionDate">Date:</label>

<input
    type="date"
    id="transactionDate"
>

<br><br>

<label for="transactionTime">Time:</label>

<input
    type="time"
    id="transactionTime"
>

<br><br>

<button
    type="button"
    id="stockIssueButton"
    onclick="stockIssue()"
>
    Stock Issue
</button>

<h2>Stock Out History</h2>

<button
    type="button"
    onclick="window.location.href='Stock Out History.html'"
>
    📋 Open Stock Out History
</button>


<script src="supabase.js"></script>
<script src="Stock out.js"></script>

</body>

</html>
