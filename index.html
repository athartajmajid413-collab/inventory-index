<script>

    // =====================================
    // SUPABASE SETTINGS
    // =====================================

    const SUPABASE_URL =
        "https://tncmmkyrpzlkupdnkyqm.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_e6j_EkJescicSS3nEOnscg_inwxeukT";


    // =====================================
    // SUPABASE AUTH REQUEST
    // =====================================

    async function supabaseAuthRequest(
        endpoint,
        data
    ){

        try{

            const response =
                await fetch(
                    SUPABASE_URL +
                    endpoint,
                    {

                        method:"POST",

                        headers:{

                            "apikey":
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(data)

                    }
                );


            const result =
                await response.json();


            if(!response.ok){

                return {

                    success:false,

                    error:result

                };

            }


            return {

                success:true,

                data:result

            };

        }
        catch(error){

            return {

                success:false,

                error:{
                    message:error.message
                }

            };

        }

    }


    // =====================================
    // SHOW REGISTER
    // =====================================

    function showRegister(){

        document
            .getElementById("loginSection")
            .classList.add("hidden");


        document
            .getElementById("registerSection")
            .classList.remove("hidden");


        clearMessages();

    }


    // =====================================
    // SHOW LOGIN
    // =====================================

    function showLogin(){

        document
            .getElementById("registerSection")
            .classList.add("hidden");


        document
            .getElementById("loginSection")
            .classList.remove("hidden");


        clearMessages();

    }


    // =====================================
    // CLEAR MESSAGES
    // =====================================

    function clearMessages(){

        document
            .getElementById("loginError")
            .textContent = "";


        document
            .getElementById("registerError")
            .textContent = "";


        document
            .getElementById("registerSuccess")
            .textContent = "";

    }


    // =====================================
    // LOGIN
    // =====================================

    async function login(event){

        event.preventDefault();


        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("loginPassword")
                .value;


        const errorElement =
            document
                .getElementById("loginError");


        errorElement.textContent =
            "Checking login...";


        const result =
            await supabaseAuthRequest(

                "/auth/v1/token?grant_type=password",

                {

                    email:email,

                    password:password

                }

            );


        console.log(
            "Login Result:",
            result
        );


        if(!result.success){

            errorElement.textContent =
                "❌ Email or Password is incorrect.";

            return;

        }


        const authUser =
            result.data.user;


        const accessToken =
            result.data.access_token;


        // =================================
        // SAVE SESSION
        // =================================

        localStorage.setItem(
            "supabase_access_token",
            accessToken
        );


        localStorage.setItem(
            "auth_user_id",
            authUser.id
        );


        localStorage.setItem(
            "logged_in",
            "true"
        );


        // =================================
        // GET USER PROFILE
        // =================================

        const profileResponse =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/users?auth_user_id=eq." +
                encodeURIComponent(authUser.id) +
                "&select=*",

                {

                    method:"GET",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            accessToken

                    }

                }

            );


        const profiles =
            await profileResponse.json();


        console.log(
            "User Profile:",
            profiles
        );


        if(
            Array.isArray(profiles) &&
            profiles.length > 0
        ){

            const profile =
                profiles[0];


            localStorage.setItem(
                "logged_in_username",
                profile.username || ""
            );


            localStorage.setItem(
                "logged_in_name",
                profile.full_name || ""
            );


            localStorage.setItem(
                "logged_in_role",
                profile.role || "User"
            );

        }
        else{

            localStorage.setItem(
                "logged_in_role",
                "User"
            );

        }


        // =================================
        // OPEN DASHBOARD
        // =================================

        window.location.href =
            "Dashboard.html";

    }


    // =====================================
    // REGISTER
    // =====================================

    async function registerUser(event){

        event.preventDefault();


        const fullName =
            document
                .getElementById("fullName")
                .value
                .trim();


        const username =
            document
                .getElementById("registerUsername")
                .value
                .trim();


        const email =
            document
                .getElementById("registerEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("registerPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const errorElement =
            document
                .getElementById("registerError");


        const successElement =
            document
                .getElementById("registerSuccess");


        errorElement.textContent = "";

        successElement.textContent = "";


        // =================================
        // PASSWORD CHECK
        // =================================

        if(password !== confirmPassword){

            errorElement.textContent =
                "❌ Passwords do not match.";

            return;

        }


        if(password.length < 6){

            errorElement.textContent =
                "❌ Password must contain at least 6 characters.";

            return;

        }


        // =================================
        // CHECK USERNAME
        // =================================

        const usernameCheck =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/users?username=eq." +
                encodeURIComponent(username) +
                "&select=id",

                {

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        const existingUsers =
            await usernameCheck.json();


        if(
            Array.isArray(existingUsers) &&
            existingUsers.length > 0
        ){

            errorElement.textContent =
                "❌ Username already exists.";

            return;

        }


        // =================================
        // CREATE AUTH USER
        // =================================

        const authResult =
            await supabaseAuthRequest(

                "/auth/v1/signup",

                {

                    email:email,

                    password:password

                }

            );


        console.log(
            "Registration Result:",
            authResult
        );


        if(!authResult.success){

            console.error(
                "Registration Error:",
                authResult.error
            );


            const message =
                authResult.error?.msg ||
                authResult.error?.message ||
                "Registration failed.";


            errorElement.textContent =
                "❌ " + message;

            return;

        }


        const authUser =
            authResult.data.user;


        if(!authUser){

            errorElement.textContent =
                "❌ User account could not be created.";

            return;

        }


        // =================================
        // SAVE PROFILE
        // =================================

        const profileResponse =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/users",

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"

                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            full_name:
                                fullName,

                            email:
                                email,

                            role:
                                "User",

                            auth_user_id:
                                authUser.id

                        })

                }

            );


        const profileResult =
            await profileResponse.json();


        console.log(
            "Profile Result:",
            profileResult
        );


        if(!profileResponse.ok){

            console.error(
                "Profile Save Error:",
                profileResult
            );


            errorElement.textContent =
                "⚠️ Account created, but profile could not be saved.";

            return;

        }


        // =================================
        // SUCCESS
        // =================================

        successElement.textContent =
            "✅ Account created successfully. You can now Login.";


        document
            .getElementById("registerPassword")
            .value = "";


        document
            .getElementById("confirmPassword")
            .value = "";


        document
            .getElementById("loginEmail")
            .value =
            email;


        setTimeout(

            function(){

                showLogin();

            },

            1500

        );

    }

</script>

</body>
