<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="Stock.css">

</head>


<body>
<h1>Stock In /Stock Issue</h1>
<label for="itemCode">Item Code :</label>
<input type="text" id="itemCode" placeholder="Enter item Code" oninput="showCurrentStock()">
<br><br>
<label for="quantity">Quantity</label>
<input type="number" id="quantity" placeholder="Enter Quantity">
<br><br>
<label for="unitCost">Unit Cost:</label>
<input type="number" id="unitCost" placeholder="Enter Unit Cost">

<br><br>

<label for="totalCost">Total Cost:</label>
<input type="number" id="totalCost" readonly>

<br><br>
<label for="transactionDate">Date :</label>
<input type="date" id="transactionDate">
<br><br>
<label for="transactionTime">Time:</label>
<input type="time" id="transactionTime">
<br><br>
<label for="currentStock">current Stock:</label>
<input type="text" id="currentStock" readonly>
<br><br>
<label for="itemName">Item Name:</label>
<input type="text" id="itemName" readonly>
<br><br>
<button type="button" onclick="stockIn()">Stock In</button>
<button type="button" onclick="stockIssue()">Stock Issue</button>
 <h2>Stock History</h2>
 <table border="1">
    <thead>
        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Item Code</th>
            <th>Type</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody id="historyBody"></tbody>
 </table>
<script src="Stock.js"></script>
</body>
</body>

</html>
