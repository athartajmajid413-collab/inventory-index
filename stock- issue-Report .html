<body>
 <h1>Stock Issue Report</h1>

 <label for="fromDate">From Date:</label>
<input type="date" id="fromDate">

<label for="toDate">To Date:</label>
<input type="date" id="toDate">

<br><br>

<button type="button" onclick="searchStockIssueByDate()">Search By Date</button>

    <thead>
        <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Item Code</th>
            <th>Quantity</th>
        </tr>
    </thead>

 </table>
 <h3>Total Stock Issue: <span id="totalStockIssue">0</span></h3>
